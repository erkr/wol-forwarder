# Rest sensor examples for WoL Forwarder
# Note: rest sensors spam the log with connection 
#       errors if the app is not running 
rest:
  # Note: consider using template triggered sensors (reponsive, no connection errors)  
  - resource: http://localhost:58080/stats
    sensor:
      - name: WOL Forwarder Status
        json_attributes_path: 'data'
        json_attributes:
          - packets
          - dns
        availability: "{{ value_json is defined and value_json.success is defined and value_json.success }}"
        value_template: |
            {% if not value_json.data.running %}
              App Stopped 
            {% elif not value_json.data.dns.healthy %}
              DNS Outdated
            {% elif value_json.data.packets.failed > 0 %}
              Failed packets
            {% else %}
              Ok
            {% endif %}
      - name: WoL Forwarder Accepted
        # This counter resets every time the app restarts
        availability: "{{ value_json is defined and value_json.success is defined and value_json.success }}"
        value_template: "{{ value_json.data.packets.accepted }}"
      - name: WoL Forwarder Rejected
        # This counter resets every time the app restarts
        availability: "{{ value_json is defined and value_json.success is defined and value_json.success }}"
        value_template: "{{ value_json.data.packets.rejected }}"
      - name: WoL Forwarder Failed
        # This counter resets every time the app restarts
        availability: "{{ value_json is defined and value_json.success is defined and value_json.success }}"
        value_template: "{{ value_json.data.packets.failed }}"
