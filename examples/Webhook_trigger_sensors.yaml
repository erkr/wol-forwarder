template:
  
  # First exanple for generic WoL event and counting sensors
  # The template counters won't reset after restarting the App
  - trigger:
    - platform: webhook
      allowed_methods:
        - POST
      local_only: false
      webhook_id: -ExxxxxxxxxxxxxxxxxxHs
    conditions: |
      {{ trigger.json is defined 
         and trigger.json.event is defined 
      }}
    sensor:
    - name: WoL forwarded
      state: |
        {% set current = this.state | int(0) %}
        {{ current+1 if trigger.json.event=='forwarded' else current }}
      state_class: total_increasing
    - name: WoL rejected
      state: |
        {% set current = this.state | int(0) %}
        {{ current+1 if trigger.json.event=='rejected' else current }}
      state_class: total_increasing
    event:
    - name: WoL event
      event_type: "{{ trigger.json.event }}"
      event_types: "{{ ['forwarded', 'rejected'] }}"
      device_class: button
      attributes:
        data: "{{ dict(trigger.json.items() | rejectattr('0', 'eq', 'event')) | to_json }}"

  # Second example provides a target specific event and sensor: 
  - trigger:
    - platform: webhook
      allowed_methods:
        - POST
      local_only: false
      webhook_id: -ExxxxxxxxxxxxxxxxxxHs
    conditions: |
      {{ trigger.json is defined 
         and trigger.json.event is defined
         and trigger.json.event=='forwarded' 
         and trigger.json.mac_address== 'EE:43:FF:AA:78:6A'
      }}
    sensor:
    - name: Waked NAS
      state:  "{{ this.state | int(0) + 1 }}"
      state_class: total_increasing
    event:
    - name: Wake NAS
      event_type: "{{ trigger.json.event }}"
      event_types: "{{ ['forwarded'] }}"
      device_class: button
      attributes:
        source: "{{ trigger.json.source_name }}"
