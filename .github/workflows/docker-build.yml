name: Build and push Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # When workflow is run for a tag, export IMAGE_TAG and IMAGE_TAG_NO_V
      - name: Set image tag variables
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          TAG_NO_V=${TAG#v}
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "IMAGE_TAG_NO_V=${TAG_NO_V}" >> $GITHUB_ENV
          
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./wol_forward_app
          file: ./wol_forward_app/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}        # e.g. v0.2.0 (only set on tag runs)
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG_NO_V }}   # e.g. 0.2.0 (only set on tag runs)
          cache-from: type=gha
          cache-to: type=gha,mode=max
